name: Verify R002

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  release-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact release verification
        run: python3 verify_release.py

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern ghostscript
      - name: Build manuscript from public source
        run: bash manuscript/build.sh
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: r002-aes-sbox-manuscript
          path: manuscript/r002-aes-sbox.pdf
